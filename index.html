<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ableitungsübungen - e-Funktionen</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 5px;
            font-size: 1.8em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .level-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .level-btn {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .level-btn.easy {
            background-color: #4CAF50;
            color: white;
        }

        .level-btn.medium {
            background-color: #FF9800;
            color: white;
        }

        .level-btn.hard {
            background-color: #f44336;
            color: white;
        }

        .level-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .level-btn.active {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .content {
            display: none;
        }

        .content.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-box {
            background: #f5f5f5;
            border-left: 5px solid;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 8px;
        }

        .easy .task-box {
            border-left-color: #4CAF50;
        }

        .medium .task-box {
            border-left-color: #FF9800;
        }

        .hard .task-box {
            border-left-color: #f44336;
        }

        .task-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .task-content {
            background: white;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .math-display {
            text-align: center;
            padding: 15px 0;
            font-size: 1.2em;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 0.95em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-new-task {
            background-color: #667eea;
            color: white;
        }

        .btn-new-task:hover {
            background-color: #5568d3;
        }

        .btn-show-solution {
            background-color: #4CAF50;
            color: white;
        }

        .btn-show-solution:hover {
            background-color: #45a049;
        }

        .btn-show-solution:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .solution-box {
            display: none;
            background: #e8f5e9;
            border: 2px solid #4CAF50;
            padding: 25px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .solution-box.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .solution-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 20px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .solution-step {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            border-left: 4px solid #4CAF50;
        }

        .step-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.05em;
        }

        .step-content {
            color: #555;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .level-selector {
                gap: 10px;
            }

            .level-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .task-box {
                padding: 15px;
            }

            .task-content {
                padding: 15px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 Ableitungsübungen</h1>
        <p class="subtitle">Ableitung von Funktionen der Form <span>$$f(x) = a \cdot e^{g(x)}+y_0$$</span></p>

        <div class="level-selector">
            <button class="level-btn easy" onclick="selectLevel('easy')">📚 Einfach</button>
            <button class="level-btn medium" onclick="selectLevel('medium')">📖 Mittel</button>
            <button class="level-btn hard" onclick="selectLevel('hard')">🔥 Schwer</button>
        </div>

        <div id="easy" class="content">
            <div class="task-box easy">
                <div class="task-title">Aufgabe</div>
                <div class="task-content">
                    <div class="math-display" id="easyTask"></div>
                </div>
                <div class="button-group">
                    <button class="btn-new-task" onclick="generateEasy()">📝 Neue Aufgabe</button>
                    <button class="btn-show-solution" onclick="showSolution('easy')">✓ Lösung zeigen</button>
                </div>
                <div class="solution-box" id="easySolution"></div>
            </div>
        </div>

        <div id="medium" class="content">
            <div class="task-box medium">
                <div class="task-title">Aufgabe</div>
                <div class="task-content">
                    <div class="math-display" id="mediumTask"></div>
                </div>
                <div class="button-group">
                    <button class="btn-new-task" onclick="generateMedium()">📝 Neue Aufgabe</button>
                    <button class="btn-show-solution" onclick="showSolution('medium')">✓ Lösung zeigen</button>
                </div>
                <div class="solution-box" id="mediumSolution"></div>
            </div>
        </div>

        <div id="hard" class="content">
            <div class="task-box hard">
                <div class="task-title">Aufgabe</div>
                <div class="task-content">
                    <div class="math-display" id="hardTask"></div>
                </div>
                <div class="button-group">
                    <button class="btn-new-task" onclick="generateHard()">📝 Neue Aufgabe</button>
                    <button class="btn-show-solution" onclick="showSolution('hard')">✓ Lösung zeigen</button>
                </div>
                <div class="solution-box" id="hardSolution"></div>
            </div>
        </div>
    </div>

    <script>
        let currentData = {};

        function selectLevel(level) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.getElementById(level).classList.add('active');
            document.querySelectorAll('.level-btn').forEach(el => el.classList.remove('active'));
            document.querySelector(`.level-btn.${level}`).classList.add('active');

            if (level === 'easy') generateEasy();
            else if (level === 'medium') generateMedium();
            else if (level === 'hard') generateHard();
        }

        function getRandomInt(min, max) {
            min = Math.max(min, -10);
            max = Math.min(max, 10);
            let result;
            do {
                result = Math.floor(Math.random() * (max - min + 1)) + min;
            } while (result === 0);
            return result;
        }

        function gcd(a, b) {
            return b === 0 ? Math.abs(a) : gcd(b, a % b);
        }

        function formatFraction(num, den) {
            if (den === 0) return num.toString();
            if (num === 0) return '0';
            
            const divisor = gcd(num, den);
            const n = num / divisor;
            const d = den / divisor;
            
            if (d === 1) return n.toString();
            if (d < 0) return `\\frac{${-n}}{${-d}}`;
            return `\\frac{${n}}{${d}}`;
        }

        function formatNumber(num) {
            if (Number.isInteger(num)) {
                return num.toString();
            }
            
            let denominator = 1;
            let numerator = num;
            
            for (let i = 1; i <= 10; i++) {
                numerator = num * i;
                if (Math.abs(numerator - Math.round(numerator)) < 0.0001) {
                    numerator = Math.round(numerator);
                    denominator = i;
                    return formatFraction(numerator, denominator);
                }
            }
            
            return num.toFixed(2);
        }

        function formatLinearTermInExponent(m, t, isFirst = false) {
            let result = '';
            
            if (isFirst) {
                if (m === 1) result = 'x';
                else if (m === -1) result = '-x';
                else result = m + 'x';
            } else {
                if (m === 1) result = '+x';
                else if (m === -1) result = '-x';
                else if (m > 0) result = '+' + m + 'x';
                else result = m + 'x';
            }

            if (t === 0) return result;
            
            if (t > 0) {
                result += '+' + t;
            } else {
                result += t;
            }

            return result;
        }

        function formatLinearTermForBracket(m, t) {
            const t_val = t / m;
            const t_display = formatNumber(t_val);
            
            if (t_val > 0) {
                return `x+${t_display}`;
            } else if (t_val < 0) {
                // Entferne das negative Vorzeichen und ersetze es durch Minus-Operator
                const absValue = t_display.startsWith('-') ? t_display.substring(1) : t_display;
                return `x-${absValue}`;
            } else {
                return 'x';
            }
        }

        function formatQuadraticTerm(a_coeff, b_coeff, c_coeff, isFirst = false) {
            let result = '';

            // Quadratic term
            if (isFirst) {
                if (a_coeff === 1) result = 'x^2';
                else if (a_coeff === -1) result = '-x^2';
                else result = a_coeff + 'x^2';
            } else {
                if (a_coeff === 1) result = '+x^2';
                else if (a_coeff === -1) result = '-x^2';
                else if (a_coeff > 0) result = '+' + a_coeff + 'x^2';
                else result = a_coeff + 'x^2';
            }

            // Linear term
            if (b_coeff !== 0) {
                if (b_coeff === 1) result += '+x';
                else if (b_coeff === -1) result += '-x';
                else if (b_coeff > 0) result += '+' + b_coeff + 'x';
                else result += b_coeff + 'x';
            }

            // Constant term
            if (c_coeff !== 0) {
                if (c_coeff > 0) result += '+' + c_coeff;
                else result += c_coeff;
            }

            return result;
        }

        function formatDerivative(a_coeff, b_coeff) {
            let result = '';

            const coeff_x = 2 * a_coeff;
            if (coeff_x === 0) return b_coeff.toString();

            if (coeff_x === 1) result = 'x';
            else if (coeff_x === -1) result = '-x';
            else result = coeff_x + 'x';

            if (b_coeff !== 0) {
                if (b_coeff > 0) result += '+' + b_coeff;
                else result += b_coeff;
            }

            return result;
        }

        function formatFactorizedQuadratic(a_coeff, x1, x2) {
            let term1 = '';
            let term2 = '';

            if (x1 >= 0) {
                term1 = `(x+${x1})`;
            } else {
                const absX1 = Math.abs(x1);
                term1 = `(x-${absX1})`;
            }

            if (x2 >= 0) {
                term2 = `(x+${x2})`;
            } else {
                const absX2 = Math.abs(x2);
                term2 = `(x-${absX2})`;
            }

            if (a_coeff === 1) return `${term1}${term2}`;
            else if (a_coeff === -1) return `-${term1}${term2}`;
            else return `${a_coeff}${term1}${term2}`;
        }

        function formatFactorizedQuadraticExpanded(m, t_val) {
            const t_display = formatNumber(t_val);
            
            let bracketContent = '';
            if (t_val > 0) {
                bracketContent = `x+${t_display}`;
            } else if (t_val < 0) {
                const absValue = t_display.startsWith('-') ? t_display.substring(1) : t_display;
                bracketContent = `x-${absValue}`;
            } else {
                bracketContent = 'x';
            }
            
            if (m === 1) return bracketContent;
            if (m === -1) return `-\\left(${bracketContent}\\right)`;
            return `${m}\\left(${bracketContent}\\right)`;
        }

        // ========================= EINFACH =========================
        function generateEasy() {
            const a = getRandomInt(-5, 5);

            // Einfach: Nur lineare Funktionen in der Form g(x) = mx + t, c = 0
            const m = getRandomInt(-3, 3);
            const t = getRandomInt(-5, 5);

            const innerTerm = formatLinearTermInExponent(m, t, true);

            const task = {
                type: 'linear_simple',
                a: a,
                m: m,
                t: t,
                c: 0,
                display: `${a === 1 ? '' : a === -1 ? '-' : a} e^{${innerTerm}}`
            };

            const solution = {
                steps: [
                    {
                        title: "Schritt 1: Ausgangsfunktion",
                        content: `$$f(x) = ${a === 1 ? '' : a === -1 ? '-' : a} e^{${innerTerm}}$$`
                    },
                    {
                        title: "Schritt 2: Kettenregel anwenden",
                        content: `$$f'(x) = a \\cdot e^{g(x)} \\cdot g'(x)$$`
                    },
                    {
                        title: "Schritt 3: Innere Ableitung g'(x) bestimmen",
                        content: `$$g'(x) = ${m}$$`
                    },
                    {
                        title: "Schritt 4: Zusammensetzen",
                        content: `$$f'(x) = ${a === 1 ? '' : a === -1 ? '-' : a} e^{${innerTerm}} \\cdot ${m}$$`
                    },
                    {
                        title: "Schritt 5: Endergebnis",
                        content: `$$f'(x) = ${a * m === 1 ? '' : a * m === -1 ? '-' : a * m} e^{${innerTerm}}$$`
                    }
                ]
            };

            currentData.easy = { task, solution };
            displayTask('easy', task);
            document.getElementById('easySolution').classList.remove('show');
        }

        // ========================= MITTEL =========================
        function generateMedium() {
            const a = getRandomInt(-5, 5);
            const c = getRandomInt(-5, 5); // c ungleich 0
            const taskType = Math.random() < 0.5 ? 'linear_complex' : 'quadratic_simple';

            let task, solution;

            if (taskType === 'linear_complex') {
                // Mittel (Linear): g(x) = m(x + t/m) mit vorfaktor ungleich 1, c ungleich 0
                const m = getRandomInt(-4, 4);
                const t = getRandomInt(-5, 5);

                const displayG = formatFactorizedQuadraticExpanded(m, t);
                const cDisplay = c > 0 ? `+${c}` : c.toString();

                task = {
                    type: 'linear_complex',
                    a: a,
                    m: m,
                    t: t,
                    c: c,
                    display: `${a === 1 ? '' : a === -1 ? '-' : a} e^{${displayG}}${cDisplay}`
                };

                solution = {
                    steps: [
                        {
                            title: "Schritt 1: Ausgangsfunktion",
                            content: `$$f(x) = ${a === 1 ? '' : a === -1 ? '-' : a} e^{${displayG}}${cDisplay}$$`
                        },
                        {
                            title: "Schritt 2: Kettenregel anwenden",
                            content: `$$f'(x) = a \\cdot e^{g(x)} \\cdot g'(x)$$`
                        },
                        {
                            title: "Schritt 3: Innere Ableitung g'(x) bestimmen",
                            content: `$$g'(x) = ${m}$$`
                        },
                        {
                            title: "Schritt 4: Zusammensetzen",
                            content: `$$f'(x) = ${a === 1 ? '' : a === -1 ? '-' : a} e^{${displayG}} \\cdot ${m}$$`
                        },
                        {
                            title: "Schritt 5: Endergebnis",
                            content: `$$f'(x) = ${a * m === 1 ? '' : a * m === -1 ? '-' : a * m} e^{${displayG}}$$`
                        }
                    ]
                };
            } else {
                // Mittel (Quadratisch): g(x) = ax² + bx + c_exp als Summe, c ungleich 0
                const a_coeff = getRandomInt(-3, 3);
                const b_coeff = getRandomInt(-5, 5);
                const c_exp = getRandomInt(-5, 5);

                const innerTerm = formatQuadraticTerm(a_coeff, b_coeff, c_exp, true);
                const g_prime = formatDerivative(a_coeff, b_coeff);
                const cDisplay = c > 0 ? `+${c}` : c.toString();

                task = {
                    type: 'quadratic_simple',
                    a: a,
                    a_coeff: a_coeff,
                    b_coeff: b_coeff,
                    c_coeff: c_exp,
                    c: c,
                    display: `${a === 1 ? '' : a === -1 ? '-' : a} e^{${innerTerm}}${cDisplay}`
                };

                solution = {
                    steps: [
                        {
                            title: "Schritt 1: Ausgangsfunktion",
                            content: `$$f(x) = ${a === 1 ? '' : a === -1 ? '-' : a} e^{${innerTerm}}${cDisplay}$$`
                        },
                        {
                            title: "Schritt 2: Kettenregel anwenden",
                            content: `$$f'(x) = a \\cdot e^{g(x)} \\cdot g'(x)$$`
                        },
                        {
                            title: "Schritt 3: Innere Ableitung g'(x) bestimmen",
                            content: `$$g'(x) = ${g_prime}$$`
                        },
                        {
                            title: "Schritt 4: Zusammensetzen",
                            content: `$$f'(x) = ${a === 1 ? '' : a === -1 ? '-' : a} e^{${innerTerm}} \\cdot (${g_prime})$$`
                        },
                        {
                            title: "Schritt 5: Endergebnis",
                            content: `$$f'(x) = ${a} \\cdot (${g_prime}) \\cdot e^{${innerTerm}}$$`
                        }
                    ]
                };
            }

            currentData.medium = { task, solution };
            displayTask('medium', task);
            document.getElementById('mediumSolution').classList.remove('show');
        }

        // ========================= SCHWER =========================
        function generateHard() {
            // Schwer: a ungleich 1, g quadratisch als Produkt, c ungleich 0
            let a = getRandomInt(-5, 5);
            while (a === 1) {
                a = getRandomInt(-5, 5);
            }
            const c = getRandomInt(-5, 5);

            const x1 = getRandomInt(-4, 4);
            const x2 = getRandomInt(-4, 4);
            const a_coeff = getRandomInt(-3, 3);

            const displayFactorized = formatFactorizedQuadratic(a_coeff, -x1, -x2);
            const cDisplay = c > 0 ? `+${c}` : c.toString();

            const task = {
                type: 'quadratic_complex',
                a: a,
                a_coeff: a_coeff,
                x1: x1,
                x2: x2,
                c: c,
                display: `${a === 1 ? '' : a === -1 ? '-' : a} e^{${displayFactorized}}${cDisplay}`
            };

            // Expand g(x) = a_coeff*(x-x1)*(x-x2)
            const b = a_coeff * (-(x1 + x2));
            const c_exp = a_coeff * x1 * x2;

            const g_prime = formatDerivative(a_coeff, b);
            const expandedInner = formatQuadraticTerm(a_coeff, b, c_exp, true);

            const solution = {
                steps: [
                    {
                        title: "Schritt 1: Ausgangsfunktion",
                        content: `$$f(x) = ${a === 1 ? '' : a === -1 ? '-' : a} e^{${displayFactorized}}${cDisplay}$$`
                    },
                    {
                        title: "Schritt 2: Kettenregel anwenden",
                        content: `$$f'(x) = a \\cdot e^{g(x)} \\cdot g'(x)$$`
                    },
                    {
                        title: "Schritt 3: Innere Ableitung g'(x) bestimmen",
                        content: `Zuerst den Exponenten in eine Summe verwandeln: $$g(x) = ${displayFactorized} = ${expandedInner}$$\nDann ableiten: $$g'(x) = ${g_prime}$$`
                    },
                    {
                        title: "Schritt 4: Zusammensetzen",
                        content: `$$f'(x) = ${a === 1 ? '' : a === -1 ? '-' : a} e^{${displayFactorized}} \\cdot (${g_prime})$$`
                    },
                    {
                        title: "Schritt 5: Endergebnis",
                        content: `$$f'(x) = ${a} \\cdot (${g_prime}) \\cdot e^{${displayFactorized}}$$`
                    }
                ]
            };

            currentData.hard = { task, solution };
            displayTask('hard', task);
            document.getElementById('hardSolution').classList.remove('show');
        }

        function displayTask(level, task) {
            const taskElement = document.getElementById(level + 'Task');
            taskElement.innerHTML = `$$f(x) = ${task.display}$$`;
            MathJax.typesetPromise([taskElement]).catch(err => console.log(err));
        }

        function showSolution(level) {
            const solutionData = currentData[level];
            if (!solutionData) return;

            const solutionElement = document.getElementById(level + 'Solution');
            let html = '<div class="solution-title">✓ Lösung mit Erklärung</div>';

            solutionData.solution.steps.forEach((step, index) => {
                html += `
                    <div class="solution-step">
                        <div class="step-title">${step.title}</div>
                        <div class="step-content">${step.content}</div>
                    </div>
                `;
            });

            solutionElement.innerHTML = html;
            solutionElement.classList.add('show');
            MathJax.typesetPromise([solutionElement]).catch(err => console.log(err));

            setTimeout(() => {
                solutionElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        // Initialisierung
        window.addEventListener('load', () => {
            selectLevel('easy');
            MathJax.typesetPromise().catch(err => console.log(err));
        });
    </script>
</body>
</html>
